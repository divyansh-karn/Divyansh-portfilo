<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Responsive Panel</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root {
            --primary: #00abf0;
            --success: #2ecc71;
            --dark: #020912;
            --card-bg: #1a252f;
            --bg: #0f172a;
            --text: #ededed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 250px;
            background: var(--dark);
            padding: 20px;
            position: fixed;
            height: 100vh;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
        }

        .nav-links li {
            margin-bottom: 15px;
        }

        .nav-links a {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #aaa;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: var(--primary);
            color: var(--dark);
            font-weight: 600;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 40px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        /* --- FORM DESIGN --- */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: white;
            font-size: 15px;
        }

        /* --- UPLOAD ZONES --- */
        .upload-zone {
            border: 2px dashed rgba(255,255,255,0.3);
            background: var(--card-bg);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 10px;
        }

        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--primary);
            background: rgba(0, 171, 240, 0.05);
        }

        .upload-zone i {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .file-info {
            font-size: 13px;
            color: #aaa;
            margin-top: 5px;
        }

        #thumb-preview {
            max-width: 150px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .submit-btn {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 12px 25px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            box-shadow: 0 0 15px var(--primary);
        }

        /* --- TABLE DESIGN --- */
        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        th {
            background: rgba(0,0,0,0.2);
            color: var(--primary);
        }

        .row-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
        }

        .delete-btn:hover {
            background: #ff2e44;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo"><i class='bx bx-grid-alt'></i> Admin Panel</div>
        <ul class="nav-links">
            <li><a href="#" class="active" data-target="add-project"><i class='bx bx-plus-circle'></i> Add Project</a></li>
            <li><a href="#" data-target="manage-projects"><i class='bx bx-folder'></i> Manage Projects</a></li>
            <li><a href="#" id="logoutBtn"><i class='bx bx-log-out'></i> Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        
        <div id="add-project" class="section active">
            <h2>Add New Project</h2>
            <form id="projectForm">
                <div class="form-group">
                    <label>Project Title</label>
                    <input type="text" id="pTitle" placeholder="Enter project name..." required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="pCategory">
                        <option value="web">Web Development</option>
                        <option value="design">UI/UX Design</option>
                        <option value="app">App Development</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Project Thumbnail (Image)</label>
                    <div class="upload-zone" id="thumbZone">
                        <i class='bx bx-image-add'></i>
                        <p>Click or Drag Image here to upload Thumbnail</p>
                        <input type="file" id="thumbInput" accept="image/*" style="display:none;">
                    </div>
                    <div class="file-info" id="thumbName">No file chosen</div>
                    <img id="thumb-preview" alt="Preview">
                </div>

                <div class="form-group">
                    <label>Project File / HTML Source (Optional)</label>
                    <div class="upload-zone" id="fileZone">
                        <i class='bx bx-file'></i>
                        <p>Click or Drag Project File here</p>
                        <input type="file" id="fileInput" style="display:none;">
                    </div>
                    <div class="file-info" id="fileName">No file chosen</div>
                </div>

                <button type="submit" class="submit-btn">Publish Project</button>
            </form>
        </div>

        <div id="manage-projects" class="section">
            <h2>Manage Live Projects</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Thumbnail</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 1. Auth Guard (Security check)
        if (localStorage.getItem('adminAuth') !== 'active') {
            window.location.href = 'login.html';
        }

        // 2. DOM Elements
        const projectForm = document.getElementById('projectForm');
        const projectTableBody = document.getElementById('projectTableBody');
        const logoutBtn = document.getElementById('logoutBtn');

        let selectedThumbBase64 = "";
        let selectedFileBase64 = "";

        // 3. Section Navigation Logic
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', function(e) {
                if(this.id === 'logoutBtn') return;
                e.preventDefault();
                document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
                this.classList.add('active');

                const target = this.getAttribute('data-target');
                document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
                document.getElementById(target).classList.add('active');
            });
        });

        // 4. Drag and Drop File Setup
        function setupUploadZone(zoneId, inputId, infoId, isThumb) {
            const zone = document.getElementById(zoneId);
            const input = document.getElementById(inputId);
            const info = document.getElementById(infoId);

            zone.onclick = () => input.click();
            zone.ondragover = (e) => { e.preventDefault(); zone.classList.add('drag-over'); };
            zone.ondragleave = () => zone.classList.remove('drag-over');
            zone.ondrop = (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                if(e.dataTransfer.files.length > 0) handleFileProcess(e.dataTransfer.files[0], isThumb, info);
            };
            input.onchange = (e) => {
                if(e.target.files.length > 0) handleFileProcess(e.target.files[0], isThumb, info);
            };
        }

        function handleFileProcess(file, isThumb, infoElement) {
            if (!file) return;
            infoElement.innerText = "✓ " + file.name;

            const reader = new FileReader();
            reader.onload = (e) => {
                if (isThumb) {
                    selectedThumbBase64 = e.target.result;
                    const preview = document.getElementById('thumb-preview');
                    preview.src = selectedThumbBase64;
                    preview.style.display = 'block';
                } else {
                    selectedFileBase64 = e.target.result;
                }
            };
            reader.readAsDataURL(file);
        }

        setupUploadZone('thumbZone', 'thumbInput', 'thumbName', true);
        setupUploadZone('fileZone', 'fileInput', 'fileName', false);

        // 5. Load and Render Function
        function loadProjects() {
            const projects = JSON.parse(localStorage.getItem('portfolioProjects')) || [];
            projectTableBody.innerHTML = "";
            
            if(projects.length === 0) {
                projectTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#aaa;">Koi project nahi milaa.</td></tr>`;
                return;
            }

            projects.forEach((proj, index) => {
                projectTableBody.innerHTML += `
                    <tr>
                        <td><img src="${proj.thumb || 'https://via.placeholder.com/50'}" class="row-thumb"></td>
                        <td><b>${proj.title}</b></td>
                        <td><span style="background:rgba(0,171,240,0.1); color:var(--primary); padding:4px 8px; border-radius:4px; font-size:12px;">${proj.category.toUpperCase()}</span></td>
                        <td><button class="delete-btn" onclick="deleteProject(${index})"><i class='bx bx-trash'></i> Delete</button></td>
                    </tr>
                `;
            });
        }

        // 6. Form Submit (Save Data)
        projectForm.onsubmit = (e) => {
            e.preventDefault();
            const title = document.getElementById('pTitle').value.trim();
            const category = document.getElementById('pCategory').value;

            if(!selectedThumbBase64) {
                alert("Kripya project ka Thumbnail upload karein!");
                return;
            }

            const projects = JSON.parse(localStorage.getItem('portfolioProjects')) || [];
            projects.push({
                id: Date.now(),
                title: title,
                category: category,
                thumb: selectedThumbBase64,
                fileContent: selectedFileBase64
            });

            localStorage.setItem('portfolioProjects', JSON.stringify(projects));
            
            // Reset Form and State
            projectForm.reset();
            document.getElementById('thumb-preview').style.display = 'none';
            document.getElementById('thumbName').innerText = "No file chosen";
            document.getElementById('fileName').innerText = "No file chosen";
            selectedThumbBase64 = "";
            selectedFileBase64 = "";
            
            loadProjects();
            alert("Project Live Ho Gaya!");
        };

        // 7. Delete Logic
        window.deleteProject = (index) => {
            if (confirm("Kya aap sach me yeh project delete karna chahte hain?")) {
                const projects = JSON.parse(localStorage.getItem('portfolioProjects')) || [];
                projects.splice(index, 1);
                localStorage.setItem('portfolioProjects', JSON.stringify(projects));
                loadProjects();
            }
        };

        // 8. Logout Logic
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('adminAuth');
                window.location.href = 'login.html';
            });
        }

        // Initial Load
        loadProjects();
    </script>
</body>
</html>
